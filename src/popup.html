<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doomscroll Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Doomscroll Blocker</h1>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <label>
        Minimum block minutes for rapid scrolling
        <input id="minBlockMinutes" type="number" min="1" max="60" step="1">
      </label>

      <label>
        Maximum block minutes for slow scrolling
        <input id="maxBlockMinutes" type="number" min="1" max="60" step="1">
      </label>

      <label>
        Scroll distance trigger
        <input id="scrollDistancePx" type="number" min="800" max="50000" step="100">
      </label>

      <label>
        Watch window in seconds
        <input id="scrollWindowSeconds" type="number" min="10" max="600" step="5">
      </label>

      <label>
        Rapid scroll speed in px/second
        <input id="rapidScrollPxPerSecond" type="number" min="100" max="5000" step="50">
      </label>

      <label class="check">
        <input id="contentInsightsEnabled" type="checkbox">
        <span>Analyze visible page text locally for category analytics. Raw text is never stored.</span>
      </label>

      <section class="analytics" aria-label="Doomscroll analytics">
        <div class="section-title">
          <h2>Analytics</h2>
          <button id="resetAnalytics" type="button" class="ghost">Reset</button>
        </div>
        <div class="stats">
          <div>
            <span id="totalBlocks">0</span>
            <p>blocks</p>
          </div>
          <div>
            <span id="timeInterrupted">0m</span>
            <p>interrupted</p>
          </div>
          <div>
            <span id="avgSpeed">0</span>
            <p>avg px/s</p>
          </div>
        </div>
        <dl>
          <div>
            <dt>Top domain</dt>
            <dd id="topDomain">None yet</dd>
          </div>
          <div>
            <dt>Top category</dt>
            <dd id="topCategory">None yet</dd>
          </div>
        </dl>
      </section>

      <label>
        Supported watched domains
        <span class="hint">Remove sites you do not want watched. This store build only runs on these supported sites.</span>
        <textarea id="domains" spellcheck="false" rows="8"></textarea>
      </label>

      <button id="save" type="button">Save</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doomscroll Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Doomscroll Blocker</h1>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <label>
        Minimum block minutes for rapid scrolling
        <input id="minBlockMinutes" type="number" min="1" max="60" step="1">
      </label>

      <label>
        Maximum block minutes for slow scrolling
        <input id="maxBlockMinutes" type="number" min="1" max="60" step="1">
      </label>

      <label>
        Scroll distance trigger
        <input id="scrollDistancePx" type="number" min="800" max="50000" step="100">
      </label>

      <label>
        Watch window in seconds
        <input id="scrollWindowSeconds" type="number" min="10" max="600" step="5">
      </label>

      <label>
        Rapid scroll speed in px/second
        <input id="rapidScrollPxPerSecond" type="number" min="100" max="5000" step="50">
      </label>

      <label class="check">
        <input id="screenReadingEnabled" type="checkbox">
        <span>Read visible page text locally when a block starts</span>
      </label>

      <label>
        Blocked domains
        <textarea id="domains" spellcheck="false" rows="8"></textarea>
      </label>

      <button id="save" type="button">Save</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
